<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuonPlayer</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #666; --bg: #fff; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --muted: #999; --bg: #16161a; --accent: #4da3ff; }
  }
  body {
    margin: 0 auto; padding: 5rem 1.25rem; max-width: 34rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p { margin: 0 0 1.25rem; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  nav { margin-top: 2.5rem; display: flex; gap: 1.5rem; }
</style>
</head>
<body>

<h1>MuonPlayer</h1>
<p class="muted">A gapless music player for iPhone and Mac.</p>

<p>MuonPlayer plays the music files you already own — FLAC, Opus, MP3, AAC, ALAC and
more — with the album transitions intact. It reads your tags, indexes your folders,
and keeps everything on your own device.</p>
