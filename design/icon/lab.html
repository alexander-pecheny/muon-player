<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muon icon lab</title>
<style>
  :root { --bg:#0d0f12; --panel:#15181d; --line:#262b32; --ink:#e7ecf2; --dim:#8b95a3; --accent:#3f9ca3; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { display:flex; min-height:100vh; }
  .panel { width:340px; flex:none; padding:20px; background:var(--panel);
           border-right:1px solid var(--line); overflow-y:auto; height:100vh; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .board { width:min(78vh,78vw); aspect-ratio:1; border-radius:16px; overflow:hidden;
           background-image:linear-gradient(45deg,#1b1e23 25%,transparent 25%),
             linear-gradient(-45deg,#1b1e23 25%,transparent 25%),
             linear-gradient(45deg,transparent 75%,#1b1e23 75%),
             linear-gradient(-45deg,transparent 75%,#1b1e23 75%);
           background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0;
           box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .board svg { display:block; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 18px; }
  .grp { margin:0 0 16px; }
  .grp h2 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim);
            margin:18px 0 10px; font-weight:600; }
  .row { display:flex; align-items:center; gap:10px; margin:9px 0; }
  .row label { flex:1; color:var(--ink); }
  .row .val { width:52px; text-align:right; color:var(--accent); font-variant-numeric:tabular-nums;
              font-feature-settings:"tnum"; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .swatches { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
  .sw { display:flex; align-items:center; gap:8px; }
  .sw label { flex:1; font-size:12px; }
  input[type=color] { width:34px; height:24px; padding:0; border:1px solid var(--line);
                      border-radius:5px; background:none; cursor:pointer; }
  .chk { display:flex; align-items:center; gap:8px; margin:10px 0; color:var(--dim); }
  .btns { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  button { flex:1; min-width:90px; padding:9px 10px; border:1px solid var(--line);
           background:#1d2127; color:var(--ink); border-radius:7px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  .derived { color:var(--dim); font-size:11px; margin-top:14px; line-height:1.7; }
  .derived b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Muon icon lab</h1>
    <p class="sub">Live port of <code>gen_icon.py</code></p>

    <div class="grp">
      <h2>Colour</h2>
      <div class="swatches">
        <div class="sw"><label>Tint</label><input type="color" id="tint" value="#3f9ca3"></div>
        <div class="sw"><label>Background</label><input type="color" id="bg" value="#000000"></div>
        <div class="sw"><label>Driver ring</label><input type="color" id="frame" value="#2b2e33"></div>
        <div class="sw"><label>Dust cap</label><input type="color" id="cap" value="#17181b"></div>
      </div>
      <label class="chk"><input type="checkbox" id="transparent"> transparent background</label>
    </div>

    <div class="grp">
      <h2>Waves</h2>
      <!-- ranges get wired up generically; data-fmt controls the readout -->
    </div>
    <div id="ranges"></div>

    <div class="btns">
      <button id="copy">Copy SVG</button>
      <button id="png">Download PNG</button>
      <button id="reset">Reset</button>
    </div>

    <div class="derived" id="derived"></div>
  </div>

  <div class="stage"><div class="board" id="board"></div></div>
</div>

<script>
const SIZE = 1024, cy = SIZE / 2;

// [id, label, min, max, step, default, decimals]
const RANGES = [
  ["stroke",     "Stroke width",   4,   60, 1,    20,   0],
  ["bow",        "Bulge",          8,  140, 1,    42,   0],
  ["waveH",      "Arc height",   200,  820, 5,   474,   0],
  ["step",       "Stroke spacing",30,  150, 1,    66,   0],
  ["bump",       "Hump height",  0.2,  1.5, 0.01, 0.72, 2],
  ["slant",      "Joiner slant", -0.5,  2.5, 0.05, 1.00, 2],
  ["driverFrac", "Driver size",  0.3,  1.3, 0.01, 0.78, 2],
  ["gap",        "Driver gap",   -40,  140, 1,     6,   0],
  ["artScale",   "Overall size", 0.3,  1.6, 0.01, 1.00, 2],
];
const COLORS = ["tint", "bg", "frame", "cap"];

const el = {};
const ranges = document.getElementById("ranges");
for (const [id, label, min, max, step, def, dec] of RANGES) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<label>${label}</label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${def}">
    <span class="val" id="${id}_v"></span>`;
  ranges.appendChild(row);
  el[id] = row.querySelector("input");
  el[id].dataset.dec = dec;
  el[id].addEventListener("input", render);
}
for (const c of COLORS) { el[c] = document.getElementById(c); el[c].addEventListener("input", render); }
el.transparent = document.getElementById("transparent");
el.transparent.addEventListener("input", render);

function params() {
  const p = {};
  for (const [id,,,,,,dec] of RANGES) p[id] = parseFloat(el[id].value);
  for (const c of COLORS) p[c] = el[c].value;
  return p;
}

// ---- faithful port of build_svg -------------------------------------------
function buildSVG(p, forExport) {
  const f = n => n.toFixed(2);
  const hc = p.waveH / 2;
  const R = (hc * hc + p.bow * p.bow) / (2 * p.bow);
  const half = Math.asin(Math.min(1, hc / R));
  const sinh = R * Math.sin(half);
  const frameR = p.driverFrac * p.waveH / 2;
  const offset = frameR + p.gap + p.bow;
  const bumpPx = p.step * p.bump;

  const ends = (ax, b) => {
    const x = b === "left" ? ax + p.bow : ax - p.bow;
    return { top: [x, cy - sinh], bottom: [x, cy + sinh] };
  };
  const arc = (ax, b, frm, to) => {
    const [x, y] = to === "top" ? ends(ax, b).top : ends(ax, b).bottom;
    const sf = b === "left" ? (frm === "bottom" ? 1 : 0) : (frm === "top" ? 1 : 0);
    return `A ${f(R)} ${f(R)} 0 0 ${sf} ${f(x)} ${f(y)}`;
  };
  const hump = (pa, pb, where, b) => {
    const ox = Math.sin(half) * p.slant * (b === "left" ? 1 : -1);
    const oy = where === "top" ? -Math.cos(half) : Math.cos(half);
    const c1 = [pa[0] + bumpPx * ox, pa[1] + bumpPx * oy];
    const c2 = [pb[0] + bumpPx * ox, pb[1] + bumpPx * oy];
    return `C ${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(pb[0])} ${f(pb[1])}`;
  };
  const letter = d => `<path d="${d}" fill="none" stroke="${p.tint}" stroke-width="${p.stroke}" `
    + `stroke-linecap="round" stroke-linejoin="round"/>`;
  const join = (a, b, bulge, where) => {
    const ea = ends(a, bulge), eb = ends(b, bulge);
    let start, up, hpa, hpb, down;
    if (where === "top") { start = ea.bottom; up = ["bottom","top"]; hpa = ea.top; hpb = eb.top; down = ["top","bottom"]; }
    else { start = ea.top; up = ["top","bottom"]; hpa = ea.bottom; hpb = eb.bottom; down = ["bottom","top"]; }
    return letter(`M ${f(start[0])} ${f(start[1])} ${arc(a,bulge,up[0],up[1])} `
      + `${hump(hpa,hpb,where,bulge)} ${arc(b,bulge,down[0],down[1])}`);
  };
  const driver = (dx, r) => {
    const s = r / 510, tx = dx - s * 512, ty = cy - s * 512;
    return `<g transform="translate(${f(tx)} ${f(ty)}) scale(${s.toFixed(4)})">`
      + `<circle cx="512" cy="512" r="510" fill="${p.frame}"/>`
      + `<circle cx="512" cy="512" r="432" fill="${p.tint}"/>`
      + `<circle cx="512" cy="512" r="150" fill="${p.cap}"/></g>`;
  };

  const left = [0,1,2,3].map(i => -(offset + i * p.step));
  const right = [0,1].map(j => offset + j * p.step);
  const dx = SIZE / 2 - ((Math.min(...left) - p.stroke / 2) + (Math.max(...right) + p.stroke / 2)) / 2;
  const L = left.map(a => a + dx), Rt = right.map(a => a + dx);

  let art = "";
  art += join(L[3], L[2], "left", "top");     // 'm'
  art += join(L[2], L[1], "left", "top");
  art += join(L[1], L[0], "left", "bottom");  // 'u' (shares L[1])
  art += join(Rt[0], Rt[1], "right", "top");  // 'n'
  art += driver(dx, frameR);                  // 'o'

  const rect = p.transparent ? "" : `<rect width="${SIZE}" height="${SIZE}" fill="${p.bg}"/>`;
  const size = forExport ? `width="${SIZE}" height="${SIZE}"` : `width="100%" height="100%"`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SIZE} ${SIZE}" ${size}>${rect}`
    + `<g transform="translate(${cy} ${cy}) scale(${p.artScale}) translate(${-cy} ${-cy})">${art}</g></svg>`;
}

function writeHash(p) {
  const q = new URLSearchParams();
  for (const [id] of RANGES) q.set(id, p[id]);
  for (const c of COLORS) q.set(c, p[c].replace("#", ""));
  q.set("t", el.transparent.checked ? 1 : 0);
  history.replaceState(null, "", "#" + q.toString());
}
function readHash() {
  if (!location.hash) return;
  const q = new URLSearchParams(location.hash.slice(1));
  for (const [id] of RANGES) if (q.has(id)) el[id].value = q.get(id);
  for (const c of COLORS) if (q.has(c)) el[c].value = "#" + q.get(c);
  if (q.has("t")) el.transparent.checked = q.get("t") === "1";
}

function render() {
  const p = params();
  for (const [id,,,,,,dec] of RANGES)
    document.getElementById(id + "_v").textContent = p[id].toFixed(dec);
  document.getElementById("board").innerHTML = buildSVG(p, false);
  writeHash(p);

  const hc = p.waveH / 2, R = (hc*hc + p.bow*p.bow) / (2*p.bow);
  const span = Math.asin(Math.min(1, hc / R)) * 180 / Math.PI;
  document.getElementById("derived").innerHTML =
    `arc radius <b>${R.toFixed(0)}</b> · half-span <b>${span.toFixed(1)}°</b> · `
    + `driver Ø <b>${(p.driverFrac * p.waveH).toFixed(0)}</b>`;
}

document.getElementById("copy").onclick = async () => {
  await navigator.clipboard.writeText(buildSVG(params(), true));
  const b = document.getElementById("copy"); b.textContent = "Copied!";
  setTimeout(() => b.textContent = "Copy SVG", 1200);
};
document.getElementById("png").onclick = () => {
  const svg = buildSVG(params(), true);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = SIZE; c.height = SIZE;
    c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = "icon.png"; a.click();
    });
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
};
document.getElementById("reset").onclick = () => {
  for (const [id,,,,,def] of RANGES) el[id].value = def;
  el.tint.value = "#3f9ca3"; el.bg.value = "#000000";
  el.frame.value = "#2b2e33"; el.cap.value = "#17181b";
  el.transparent.checked = false;
  render();
};

readHash();
render();
</script>
</body>
</html>
