name: MuonPlayer
options:
  bundleIdPrefix: com.muonplayer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MuonPlayer:
    type: application
    platform: iOS
    sources:
      - path: MuonPlayer
        excludes:
          - Info.plist
    info:
      path: MuonPlayer/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - framework: Vendor/FFmpeg/libavcodec.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavformat.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavutil.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libswresample.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.muonplayer.app
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/FFmpeg/include
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/Vendor/FFmpeg/include/module.modulemap
        - -Xcc
        - -I$(SRCROOT)/Vendor/FFmpeg/include
  MuonPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuonPlayerTests
    dependencies:
      - target: MuonPlayer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.muonplayer.tests
      GENERATE_INFOPLIST_FILE: true
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/FFmpeg/include
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/Vendor/FFmpeg/include/module.modulemap
        - -Xcc
        - -I$(SRCROOT)/Vendor/FFmpeg/include
