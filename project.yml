name: MuonPlayer
options:
  bundleIdPrefix: com.muonplayer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MuonPlayer:
    type: application
    platform: iOS
    sources:
      - path: MuonPlayer
        excludes:
          - Info.plist
    info:
      path: MuonPlayer/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.muonplayer.app
      SWIFT_STRICT_CONCURRENCY: complete
  MuonPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuonPlayerTests
    dependencies:
      - target: MuonPlayer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.muonplayer.tests
      GENERATE_INFOPLIST_FILE: true
