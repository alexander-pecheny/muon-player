name: MuonPlayer
options:
  bundleIdPrefix: me.pecheny
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

# Both apps share everything but the UI: MuonPlayer/{Audio,Library,Models,
# Playback,Scanner,Scrobble,Shared} is compiled into each target, while
# MuonPlayer/{Views,App,SelfTests} is iPhone-only and MuonPlayerMac/ is Mac-only.
targets:
  MuonPlayer:
    type: application
    platform: iOS
    sources:
      - path: MuonPlayer
        excludes:
          - Info.plist
    info:
      path: MuonPlayer/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - framework: Vendor/FFmpeg/libavcodec.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavformat.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavutil.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libswresample.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.muonplayer
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/FFmpeg/include
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/Vendor/FFmpeg/include/module.modulemap
        - -Xcc
        - -I$(SRCROOT)/Vendor/FFmpeg/include
  MuonPlayerMac:
    type: application
    platform: macOS
    sources:
      - path: MuonPlayer
        excludes:
          - Info.plist
          - Views          # iPhone UI
          - App            # iPhone entry point (AVAudioSession)
          - SelfTests      # simulator-only launch harnesses
      - path: MuonPlayerMac
    info:
      path: MuonPlayerMac/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: MuonPlayerMac/MuonPlayerMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Tag editing rewrites the user's own files in place, so read-only access
        # to the chosen folders is not enough.
        com.apple.security.files.user-selected.read-write: true
        # Library folders are remembered across launches as security-scoped
        # bookmarks; without this the sandbox grant dies with the process.
        com.apple.security.files.bookmarks.app-scope: true
        # Last.fm scrobbling.
        com.apple.security.network.client: true
    dependencies:
      - framework: Vendor/FFmpeg/libavcodec.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavformat.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavutil.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libswresample.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.muonplayer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/FFmpeg/include
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/Vendor/FFmpeg/include/module.modulemap
        - -Xcc
        - -I$(SRCROOT)/Vendor/FFmpeg/include

  # The seam scan is app code (Audio/{EdgeDecoder,GaplessScan}); this is the front end
  # that runs it over the whole library from a terminal. It links the same FFmpeg the
  # player does, so a defect it reports is one the player would play.
  MuonGapless:
    type: tool
    platform: macOS
    sources:
      - path: MuonGapless
      - path: MuonPlayer/Audio/EdgeDecoder.swift
      - path: MuonPlayer/Audio/GaplessScan.swift
      - path: MuonPlayer/Audio/GaplessInfo.swift
      - path: MuonPlayer/Audio/GaplessTrims.swift
      - path: MuonPlayer/Audio/FFmpeg.swift
      - path: MuonPlayer/Audio/FFmpegMetadata.swift
      - path: MuonPlayer/Audio/TextEncodingRepair.swift
      - path: MuonPlayer/Scanner/FileScanner.swift
      - path: MuonPlayer/Models/Track.swift
    dependencies:
      - framework: Vendor/FFmpeg/libavcodec.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavformat.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libavutil.xcframework
        embed: false
      - framework: Vendor/FFmpeg/libswresample.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      PRODUCT_NAME: muon-gapless
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/FFmpeg/include
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/Vendor/FFmpeg/include/module.modulemap
        - -Xcc
        - -I$(SRCROOT)/Vendor/FFmpeg/include

  MuonPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuonPlayerTests
    dependencies:
      - target: MuonPlayer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.muonplayer.tests
      GENERATE_INFOPLIST_FILE: true
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/FFmpeg/include
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/Vendor/FFmpeg/include/module.modulemap
        - -Xcc
        - -I$(SRCROOT)/Vendor/FFmpeg/include
